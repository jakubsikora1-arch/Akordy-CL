<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f232a"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="56%" r="42%">
      <stop offset="0" stop-color="#ff9f1c" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#f5a524" stop-opacity=".09"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbe4d"/>
      <stop offset="1" stop-color="#f09a12"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <!-- pozadí na celou plochu (iOS i Android si ikonu oříznou samy) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- hmatník: 6 strun, 4 pražce; obsah leží ve středních ~70 % (bezpečná zóna maskable) -->
  <g transform="translate(512 512) scale(1.27) translate(-512 -492)">
    <!-- plocha hmatníku -->
    <rect x="292" y="262" width="440" height="560" rx="14" fill="#171a1f" stroke="#3a404b" stroke-width="4"/>
    <!-- pražce -->
    <g stroke="#59616e" stroke-width="9" stroke-linecap="round">
      <line x1="312" y1="402" x2="712" y2="402"/>
      <line x1="312" y1="542" x2="712" y2="542"/>
      <line x1="312" y1="682" x2="712" y2="682"/>
      <line x1="312" y1="822" x2="712" y2="822"/>
    </g>
    <!-- struny -->
    <g stroke="#c9ced6" stroke-linecap="round">
      <line x1="312" y1="262" x2="312" y2="822" stroke-width="13"/>
      <line x1="392" y1="262" x2="392" y2="822" stroke-width="11.5"/>
      <line x1="472" y1="262" x2="472" y2="822" stroke-width="10"/>
      <line x1="552" y1="262" x2="552" y2="822" stroke-width="8.5"/>
      <line x1="632" y1="262" x2="632" y2="822" stroke-width="7.5"/>
      <line x1="712" y1="262" x2="712" y2="822" stroke-width="6.5"/>
    </g>
    <!-- nultý pražec (kobylka) -->
    <rect x="292" y="248" width="440" height="30" rx="12" fill="#e8eaed"/>
    <!-- značky nad hmatníkem: ✕ nehrát, ○ prázdná struna (akord C) -->
    <g stroke="#ef5350" stroke-width="14" stroke-linecap="round">
      <line x1="290" y1="168" x2="334" y2="212"/>
      <line x1="334" y1="168" x2="290" y2="212"/>
    </g>
    <g fill="none" stroke="#e8eaed" stroke-width="11">
      <circle cx="552" cy="190" r="24"/>
      <circle cx="712" cy="190" r="24"/>
    </g>
    <!-- prsty 1, 2, 3 -->
    <g filter="url(#sh)">
      <circle cx="632" cy="332" r="49" fill="url(#dot)"/>
      <circle cx="472" cy="472" r="49" fill="url(#dot)"/>
      <circle cx="392" cy="612" r="49" fill="url(#dot)"/>
    </g>
    <g fill="#1a1206" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="700" font-size="64" text-anchor="middle">
      <text x="632" y="356">1</text>
      <text x="472" y="496">2</text>
      <text x="392" y="636">3</text>
    </g>
  </g>
</svg>
